<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Navy squircle -->
  <rect width="100" height="100" rx="20" ry="20" fill="#1A3560"/>

  <!-- Large circle arc ~300° clockwise, start top (50,10), end bottom-right (76.87,74.87) -->
  <path d="M 50,10 A 38,38 0 1 1 76.87,74.87"
    fill="none" stroke="#5BA3F5" stroke-width="4" stroke-linecap="round"/>

  <!-- Checkmark at ring endpoint -->
  <polyline points="76.87,74.87 68.87,81.87 80.87,68.87"
    fill="none" stroke="#5BA3F5" stroke-width="4"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bold white FJ -->
  <text x="50" y="56" text-anchor="middle" dominant-baseline="auto"
    font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
    font-weight="900" font-size="32" letter-spacing="-1" fill="white">FJ</text>
</svg>
