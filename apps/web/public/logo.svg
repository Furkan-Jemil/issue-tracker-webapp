<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Navy rounded-square background -->
  <rect width="100" height="100" rx="22" ry="22" fill="#1E3A5F"/>

  <!-- Blue circle ring (open at bottom-right for checkmark) -->
  <!-- Full circle stroke, then a white arc to "break" it at 5 o'clock position -->
  <circle cx="50" cy="47" r="32" fill="none" stroke="#4A90D9" stroke-width="4"
    stroke-dasharray="170 31"
    stroke-dashoffset="0"
    stroke-linecap="round"
    transform="rotate(-90 50 47)"/>

  <!-- Checkmark at bottom-right of circle (5 o'clock) -->
  <polyline
    points="63,74 67,79 75,69"
    fill="none"
    stroke="#4A90D9"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Bold white "FJ" text -->
  <text
    x="50"
    y="58"
    text-anchor="middle"
    dominant-baseline="auto"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-weight="900"
    font-size="34"
    letter-spacing="-1"
    fill="white">FJ</text>
</svg>
