<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Navy rounded-square background -->
  <rect width="100" height="100" rx="21" ry="21" fill="#1A3560"/>

  <!-- Circle ring with gap at bottom-right (~5 o'clock)
       r=33, circumference≈207, arc=176, gap=31
       rotate(-45) starts dasharray at bottom-right (45° from SVG 0°) -->
  <circle cx="50" cy="50" r="33" fill="none" stroke="#5BA3F5"
    stroke-width="4.5" stroke-linecap="round"
    stroke-dasharray="176 31"
    transform="rotate(-45 50 50)"/>

  <!-- Double checkmark in the gap at bottom-right -->
  <g stroke="#5BA3F5" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="60,74 64,79 72,68"/>
    <polyline points="66,74 70,79 78,68"/>
  </g>

  <!-- Bold white FJ -->
  <text x="50" y="57" text-anchor="middle" dominant-baseline="auto"
    font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
    font-weight="900" font-size="34" letter-spacing="-1" fill="white">FJ</text>
</svg>
