<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Navy squircle -->
  <rect width="100" height="100" rx="22" ry="22" fill="#1C3A5E"/>

  <!-- Circle ring ~305°: start 7 o'clock (31.5,78), end 4:30 o'clock (76.2,72.2) -->
  <path d="M 31.5,78 A 37,37 0 1 1 76.2,72.2"
    fill="none" stroke="#5BA3F5" stroke-width="4.2" stroke-linecap="round"/>

  <!-- Double checkmark below ring end -->
  <g stroke="#5BA3F5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="63,77 68,83 79,68"/>
    <polyline points="70,77 75,83 86,68"/>
  </g>

  <!-- Bold white FJ -->
  <text x="50" y="56" text-anchor="middle" dominant-baseline="auto"
    font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
    font-weight="900" font-size="33" letter-spacing="-1" fill="white">FJ</text>
</svg>
